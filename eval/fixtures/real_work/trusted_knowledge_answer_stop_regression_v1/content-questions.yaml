  - id: Q8-04
    scenario: Q8
    critical: false
    question: 是否把现有证据限定为代码结构、局部行为和使用 FakePostgres/内存替身的测试，而非真实 PostgreSQL 端到端？
  - id: Q8-05
    scenario: Q8
    critical: false
    question: 是否要求当前 DDL/迁移、兼容种子或样例、固定提交及真实 PostgreSQL 查询/预览作为最小直接证据？
