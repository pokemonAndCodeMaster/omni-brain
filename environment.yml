name: omni-brain
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      # 知识库摄入与检索
      - jieba>=0.42.1          # 中文分词（BM25 预处理）
      - pyyaml>=6.0.1          # YAML frontmatter 解析
      - python-frontmatter>=1.1.0  # Markdown + YAML frontmatter 解析
      - rich>=13.0.0           # 终端美化输出

      # 摄入流水线
      - httpx>=0.27.0          # 异步 HTTP 客户端（调用模型 API）

      # 未来 Web API（Phase 5+）
      # - fastapi>=0.111.0
      # - uvicorn[standard]>=0.30.0

      # 开发工具
      - pytest>=8.0.0
      - ruff>=0.4.0            # linter + formatter
      - mypy>=1.10.0
