$('#app').innerHTML=`<aside class="sidebar"><div class="brand"><span class="brand-mark">${icon('layers')}</span>共作 <small>Workbench</small></div><div class="workspace-switch">${icon(isTeam()?'layers':'user')}<select id="workspace" aria-label="切换演示空间"><option value="team" ${isTeam()?'selected':''}>质检团队 · 团队版</option><option value="personal" ${!isTeam()?'selected':''}>我的空间 · 个人版</option></select></div><div class="nav-caption">日常工作</div>${nav('home','home','我的工作')}${nav('work','work','工作事项')}${nav('ideas','idea','灵感与讨论')}${nav('knowledge','book','知识')}<div class="nav-caption">固定呈现</div>${nav('meeting','meeting',isTeam()?'周度组会':'我的周回顾')}<div style="padding:9px 11px;font-size:10px;color:var(--muted);line-height:1.9">同一事项，多种阅读方式。<br>只显示你需要的入口。</div><div class="sidebar-footer">${nav('maintenance','settings','维护中心')}<button class="nav-item" data-action="help">${icon('eye')} 原型说明</button><div class="profile"><span class="avatar me">我</span><div style="flex:1"><div class="small strong">${isTeam()?'团队成员 / 演示维护者':'个人使用者'}</div><div class="sub">v0.3 · 离线交互原型</div></div></div></div></aside><header class="topbar"><button class="btn ghost mobile-nav" data-action="mobile-nav" aria-label="打开导航">${icon('menu')}</button><div class="crumb"><span>${isTeam()?'质检团队':'我的空间'}</span><span class="muted">/</span><span>${esc(labels[ui.page])}</span></div><span class="spacer"></span><span class="demo-tag">示例数据 · 未连接真实服务</span><button class="btn search-button" data-action="search">${icon('search')}<span>查找事项或知识</span><span class="spacer"></span><kbd class="kbd">⌘ K</kbd></button>${btn(icon('plus')+'记录','capture','primary')}</header><main class="content" id="main"><div class="page">${({home:homePage,work:workPage,ideas:ideasPage,knowledge:knowledgePage,detail:detailPage,meeting:meetingPage,maintenance:maintenancePage}[ui.page]||homePage)()}</div></main>`;
if(ui.drawer)renderDrawer(); else if(!$('#modal'))$('#overlay').innerHTML='';document.body.classList.toggle('present-mode',ui.present);}
function nav(page,ico,text){const active=ui.page===page||(page==='work'&&ui.page==='detail');return `<button class="nav-item ${active?'active':''}" data-action="nav" data-page="${page}" ${active?'aria-current="page"':''}>${icon(ico)}${text}${page==='home'?`<span class="count">${roots().filter(x=>x.attention).length}</span>`:''}</button>`;}
function pageHead(title,sub,actions='',eyebrow=''){return `<header class="page-head"><div>${eyebrow?`<div class="eyebrow">${esc(eyebrow)}</div>`:''}<h1>${esc(title)}</h1><div class="subtitle">${sub}</div></div><div class="inline">${actions}</div></header>`;}
function sectionTitle(title,right=''){return `<div class="section-title"><h2>${title}</h2>${right}</div>`;}
function simpleRow(i){return `<div class="list-row"><span class="mono muted">${esc(i.id)}</span><div class="grow"><button class="text-btn list-title" data-action="open" data-id="${i.id}" style="color:var(--ink)">${esc(i.title)}</button><div class="list-sub">${esc(i.update)}</div></div>${status(i.state)}${btn(icon('arrow'),'open','ghost icon-only',`data-id="${i.id}" aria-label="打开${esc(i.title)}"`)}</div>`;}
function homePage(){let need=roots().filter(x=>x.attention),doing=roots().filter(x=>x.state!=='已完成');return pageHead('我的工作','周六，9 月 5 日 <span class="muted">· 演示日期 2026-09-05</span>',btn(icon('meeting')+(isTeam()?'打开组会':'打开周回顾'),'nav','',`data-page="meeting"`),'FOCUS / 把注意力留给真正需要你的事')+`<div class="two-cols"><div><div class="summary-line"><div><strong>${need.length}</strong><span>项需要判断</span></div><div><strong>${doing.length}</strong><span>项正在推进</span></div><div><strong>${db().runs.filter(r=>r.state==='运行中').length}</strong><span>个委托运行</span></div></div>${sectionTitle('需要我处理',badge('先看变化，再作决定','blue'))}<div class="panel">${need.map(i=>`<div class="action-row"><span class="badge-icon">${icon(i.state==='已阻塞'?'flag':'message')}</span><div class="row-main"><div class="inline" style="margin-bottom:5px"><span class="mono muted">${i.id}</span>${badge(i.state==='已阻塞'?'补充条件':'有新提案','amber')}</div><h3>${esc(i.title)}</h3><p>${esc(i.update)}</p><span class="tiny muted">${i.context.proposals.length?'候选修改保留原文与来源，采纳后更新共享上下文。':'这项决定属于你，不需要重新描述全部背景。'}</span></div>${btn(i.context.proposals.length?'查看上下文变化':'打开事项','open','',`data-id="${i.id}" data-tab="${i.context.proposals.length?'context':'overview'}"`)}</div>`).join('')||'<div class="empty">当前没有待你判断的事项。</div>'}</div>${sectionTitle('我关注的结果',btn('查看全部 '+icon('arrow'),'nav','ghost sm',`data-page="work"`))}<div class="panel">${doing.map(simpleRow).join('')}</div>${sectionTitle('回来后，不必再从头解释')}<div class="notice">${icon('layers')}<div><strong>每件工作有自己的持续上下文。</strong><br>当前目标、共识、材料、未决问题与成果都留在事项里。会话结束，不会让工作失去记忆。</div></div></div><aside class="stack"><div class="panel pad"><h2 style="font-size:14px">先把想法留下来</h2><textarea class="capture" id="quickCapture" aria-label="随手记录" placeholder="一句灵感、一个问题，或一段反馈……"></textarea><div class="between" style="margin-top:10px"><span class="tiny muted">仅保存，不启动 AI</span>${btn('记下来','quick-save','primary sm')}</div></div><div class="panel pad"><h2 style="font-size:14px">最近的共同理解</h2><div class="note-card"><div class="inline">${badge('共识 v3','blue')}<span class="tiny muted">${isTeam()?'QC-101':'P-201'}</span></div><p>${esc(roots()[0].scope)}</p><button class="text-btn" data-action="open" data-id="${roots()[0].id}" data-tab="context">查看依据与未决问题 ${icon('arrow')}</button></div><div class="note-card"><h3>任务结束后，能力继续成长</h3><p>复盘可以形成知识补充、Skill 改进或流程调整候选；并非每次都要新增一个 Agent。</p><button class="text-btn" data-action="open" data-id="${(roots().find(i=>i.state==='已完成')||roots()[0]).id}" data-tab="retro">查看复盘与改进</button></div></div><div class="panel pad"><span class="tiny muted">当前工作环境</span><h3 style="margin:8px 0">${isTeam()?'OpenCode + 团队执行机':'Codex / OpenCode + 我的 WSL'}</h3><p class="small sub" style="margin:0">${isTeam()?'复用已准备的 Ubuntu 20.04 镜像，不重建 Agent 框架。':'个人事项也可以没有代码仓、容器和研发流程。'}</p></div></aside></div>`;}
function getFilteredItems(){let list=roots();if(ui.kind==='mine')list=list.filter(i=>i.owner==='我');if(ui.filter)list=list.filter(i=>i.domains.includes(ui.filter)||i.topics.includes(ui.filter));if(ui.search)list=list.filter(i=>(i.title+i.id+i.update).toLowerCase().includes(ui.search.toLowerCase()));return list;}
function workTable(items){return `<div class="table-wrap"><table class="data-table"><thead><tr><th>工作事项 / 本轮结果</th><th>最新进展</th><th>责任人</th><th>状态</th><th>目标时间</th><th></th></tr></thead><tbody>${items.map(i=>`<tr><td class="title"><div class="id">${i.id} · ${esc(i.kind)}</div><button class="text-btn row-link" data-action="open" data-id="${i.id}">${esc(i.title)}</button><div class="chips" style="margin-top:6px">${i.domains.map(x=>badge(x)).join('')}${i.topics.length>1?badge('关联 '+i.topics.length+' 个专题','blue'):''}</div></td><td class="progress">${esc(i.update)}</td><td class="nowrap">${owner(i.owner)}</td><td>${status(i.state)}</td><td class="mono nowrap">${esc(i.due||'未安排')}</td><td>${btn(icon('eye'),'peek','ghost icon-only',`data-id="${i.id}" aria-label="预览${esc(i.title)}"`)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">没有符合当前条件的事项。</td></tr>'}</tbody></table></div>`;}
function workPage(){let list=getFilteredItems();let grouped={};for(const i of list){const keys=ui.group==='topic'?(i.topics.length?i.topics:['未关联专题']):ui.group==='domain'?i.domains:['全部事项'];for(const k of keys)(grouped[k]??=[]).push(i);}return pageHead('工作事项','事项只维护一份。专题表达阶段成果，领域表达长期关注范围。',btn(icon('plus')+'新建事项','new-item','primary'))+`<div class="tabs"><button class="tab ${ui.workTab==='items'?'active':''}" data-action="work-tab" data-tab="items">事项</button><button class="tab ${ui.workTab==='topics'?'active':''}" data-action="work-tab" data-tab="topics">专题</button></div>${ui.workTab==='topics'?topicsPage():`<div class="toolbar"><div class="segmented"><button class="${ui.kind==='all'?'active':''}" data-action="work-kind" data-kind="all">${isTeam()?'团队结果':'我的全部'}</button><button class="${ui.kind==='mine'?'active':''}" data-action="work-kind" data-kind="mine">我负责的</button></div><select id="workFilter" aria-label="筛选领域或专题"><option value="">全部领域 / 专题</option>${[...db().domains,...db().topics.map(t=>t.name)].map(x=>`<option ${ui.filter===x?'selected':''}>${esc(x)}</option>`).join('')}</select><span class="spacer"></span><span class="caption">分组</span><select id="workGroup" aria-label="分组方式"><option value="none" ${ui.group==='none'?'selected':''}>不分组</option><option value="topic" ${ui.group==='topic'?'selected':''}>专题</option><option value="domain" ${ui.group==='domain'?'selected':''}>领域</option></select>${btn('保存此呈现','save-view','')}${btn(icon('meeting')+'会议呈现','nav','',`data-page="meeting"`)}</div>${ui.group==='topic'?`<div class="notice neutral" style="margin-bottom:14px">${icon('layers')}<span>跨专题事项仍是同一个 ID。分组展示允许重复出现；本页总数按事项去重，会议模式进一步避免重复讲述。</span></div>`:''}<div class="panel">${Object.entries(grouped).map(([k,rows])=>`${ui.group!=='none'?`<div class="group-head">${icon(ui.group==='topic'?'flag':'layers')}<strong>${esc(k)}</strong><span class="muted">${rows.length} 项</span></div>`:''}${workTable(rows)}`).join('')||'<div class="empty">暂无事项</div>'}<div class="table-footer">去重后 ${list.length} 项成果 · 子工作默认收起 · 示例状态不是实际项目进度</div></div>${isTeam()?sectionTitle('我的具体贡献')+`<div class="panel">${db().items.filter(i=>i.parentId&&i.owner==='我').map(i=>`<div class="list-row"><div class="grow"><button class="text-btn list-title" data-action="open" data-id="${i.id}">${esc(i.title)}</button><div class="list-sub">属于 ${i.parentId} · ${esc(getItem(i.parentId).title)}</div></div>${status(i.state)}</div>`).join('')}</div>`:''}`}`;}
function topicsPage(){return `<div class="notice neutral" style="margin-bottom:20px">${icon('flag')}<div>专题有一个阶段结果，也允许结束。长期的“人工质检”“学习”“游戏”属于领域，不必建成永不结束的专题。</div></div><div class="stack">${db().topics.map(t=>`<div class="panel pad"><div class="between"><div><div class="eyebrow">阶段性项目 / 专题</div><h2 style="margin-bottom:5px">${esc(t.name)}</h2><p class="small sub">${esc(t.goal)}</p></div>${btn('查看关联事项 '+icon('arrow'),'filter-topic','',`data-topic="${esc(t.name)}"`)}</div><div class="inline tiny sub">${owner(t.owner)}<span>目标 ${t.due}</span>${badge(roots().filter(i=>i.topics.includes(t.name)).length+' 个关联结果')}<span>进展以结果和证据判断，不按任务数平均。</span></div></div>`).join('')}</div>`;}
function ideasPage(){return pageHead('灵感与讨论','记录原话，保留分歧。成熟的线索可以关联到已有事项，也可以形成新的工作。',btn(icon('plus')+'记录灵感','capture','primary'))+`<div class="board">${['待整理','讨论中','已有后续'].map(stage=>`<section class="board-col"><div class="between"><h2 style="font-size:13px;margin:0">${stage}</h2>${badge(db().ideas.filter(i=>i.state===stage).length)}</div>${db().ideas.filter(i=>i.state===stage).map(i=>`<article class="idea-card"><div class="inline" style="margin-bottom:10px">${badge(i.scope)}<span class="mono tiny muted">${i.id}</span></div><h3>${esc(i.title)}</h3><p>${esc(i.body)}</p><div class="idea-match">${icon('link')} ${esc(i.reason)}</div><div class="origin">${esc(i.origin)} · 原始记录保留</div><div class="inline">${i.related?btn('查看 '+i.related,'open','sm',`data-id="${i.related}"`):btn('形成工作事项','promote','sm',`data-id="${i.id}"`)}${btn('继续讨论','idea-discuss','ghost sm',`data-id="${i.id}"`)}</div></article>`).join('')||'<div class="empty">这里还没有灵感</div>'}</section>`).join('')}</div>`;}
function detailPage(){const i=current(),r=rootOf(i),ctx=r.context;let names={overview:'概览',context:'共享上下文',outputs:'成果与验证',activity:'推进记录',retro:'复盘与成长'};return pageHead(i.title,esc(i.goal),btn(icon('spark')+'委托 AI','delegate','primary',`data-id="${i.id}"`)+btn(icon('message')+'就地讨论','chat','',`data-id="${i.id}"`),`${i.id} / ${i.kind}`)+`<div class="detail-meta" style="margin-top:-13px;margin-bottom:20px">${status(i.state)}${owner(i.owner)}<span>责任人</span><span class="muted">·</span><span>目标 ${esc(i.due||'未安排')}</span>${i.domains.map(d=>badge(d)).join('')}${badge('上下文 v'+ctx.revision,'blue')}${i.parentId?badge('继承 '+r.id+' 的共同背景','purple'):''}<span class="spacer"></span>${btn('编辑关系','edit-relations','ghost sm',`data-id="${i.id}"`)}</div><div class="tabs">${Object.entries(names).map(([key,name])=>`<button class="tab ${ui.tab===key?'active':''}" data-action="detail-tab" data-tab="${key}">${name}${key==='context'&&ctx.proposals.length?badge(ctx.proposals.length,'amber'):''}</button>`).join('')}</div><div class="detail-layout"><div class="detail-main">${({overview:overviewTab,context:contextTab,outputs:outputsTab,activity:activityTab,retro:retroTab}[ui.tab]||overviewTab)(i)}</div><aside class="detail-aside">${detailAside(i)}</aside></div>`;}
function detailAside(i){const r=rootOf(i),runs=db().runs.filter(x=>x.itemId===r.id||x.itemId===i.id);return `<div class="panel pad"><div class="between"><h2 style="font-size:13px;margin:0">工作关系</h2>${btn(icon('edit'),'edit-relations','ghost icon-only',`data-id="${i.id}" aria-label="编辑工作关系"`)}</div><div class="prop"><span>协调责任</span><div>${owner(i.owner)}</div></div><div class="prop"><span>参与者</span><div class="prop-value">${i.participants.map(esc).join('、')}</div></div><div class="prop"><span>关联专题</span><div class="chips">${i.topics.map(x=>`<button class="tag text-btn" data-action="filter-topic" data-topic="${esc(x)}">${esc(x)}</button>`).join('')||'<span class="muted">不要求关联</span>'}</div></div><div class="prop"><span>所属领域</span><div>${i.domains.map(esc).join('、')}</div></div><div class="prop"><span>影响资产</span><div class="prop-value">${i.assets.map(esc).join('、')}</div></div><div class="link-capability">关系用于定位与汇总；能否同步或操作外部资源，由连接能力决定。</div></div><div class="panel pad"><h2 style="font-size:13px">本事项的运行</h2>${runs.map(run=>`<div class="note-card"><div class="between"><span class="mono">${run.id}</span>${status(run.state)}</div><p>${esc(run.goal)}</p><div class="tiny muted">${run.engine} · ${run.machine}<br>使用上下文 v${run.rev}${run.rev<r.context.revision?' · 有新共识待同步':''}</div><button class="text-btn" data-action="run-detail" data-id="${run.id}" style="margin-top:8px">查看运行与环境</button></div>`).join('')||'<p class="small muted">尚未启动运行。记录与讨论不要求创建容器。</p>'}</div><div class="panel pad"><h2 style="font-size:13px">这不是一个共享聊天窗口</h2><p class="small sub" style="margin:0">不同人和 Agent 使用自己的会话，共享当前确认的工作事实。候选修改经过采纳后才成为新的共识。</p>${btn('查看上下文结构','detail-tab','ghost sm',`data-tab="context" style="margin-top:8px"`)}</div>`;}
function overviewTab(i){const r=rootOf(i),ctx=r.context;return `${i.attention?`<div class="notice warning" style="margin-bottom:17px">${icon('flag')}<div><strong>${ctx.proposals.length?'有一项上下文修改等待确认':'当前需要补充条件'}</strong><br>${esc(i.update)} ${btn(ctx.proposals.length?'查看变化':'记录反馈',ctx.proposals.length?'detail-tab':'feedback','ghost sm',`data-tab="context" data-id="${i.id}"`)}</div>`:''}<article class="panel article"><h2>这次要得到什么</h2><p>${esc(i.goal)}</p><h3>本轮范围</h3><p>${esc(i.scope)}</p><h3>当前结果，而不是一个百分比</h3><blockquote>${esc(i.update)}</blockquote><h3>怎样判断可以接受</h3><div class="accept-list">${i.evidence.map(e=>`<div class="accept-row ${e.result!=='已证明'?'todo':''}">${icon(e.result==='已证明'?'check':'circle')}<div><strong>${esc(e.name)}</strong> · ${esc(e.purpose)} <span style="margin-left:6px">${status(e.result)}</span></div></div>`).join('')}</div><div style="margin-top:20px">${btn('查看成果与证据 '+icon('arrow'),'detail-tab','',`data-tab="outputs"`)}</div></article>${sectionTitle(i.parentId?'关联的上层结果':'分工与贡献',badge('责任人 ≠ AI 执行者'))}<div class="panel">${i.parentId?simpleRow(r):db().items.filter(x=>x.parentId===i.id).map(simpleRow).join('')||`<div class="list-row"><div class="grow"><strong class="small">本轮直接推进，不必拆子任务</strong><div class="list-sub">足够简单时，一项工作、一份上下文、一个结果即可。</div></div>${owner(i.owner)}</div>`}</div>`;}
function contextTab(i){const r=rootOf(i),ctx=r.context;return `<div class="notice" style="margin-bottom:18px">${icon('layers')}<div><strong>${r.id} 的持续上下文 · 当前 v${ctx.revision}</strong><br>人和 Agent 共同消费这些记录；各自会话只取本次需要的部分，不共享一条无限增长的聊天历史。</div></div><div class="panel article"><div class="between"><h2>当前确认的理解</h2>${btn(icon('edit')+'提出修订','propose','',`data-id="${r.id}"`)}</div><div class="fact-card"><div class="fact-top"><h3>要解决的问题与目标</h3>${badge('当前共识','green')}</div><p>${esc(ctx.goal)}</p><div class="source-line">来源：本事项的当前目标 · 版本历史保留形成依据</div></div>${ctx.decisions.map((d,k)=>`<div class="fact-card"><div class="fact-top"><h3>${esc(d.title)}</h3>${badge('已确认','green')}</div><p>${esc(d.body)}</p><div class="between"><div class="source-line">依据：${esc(d.source)}</div><button class="text-btn" data-action="feedback" data-id="${r.id}" data-anchor="${esc(d.title)}">就此讨论</button></div></div>`).join('')}<div class="fact-card"><div class="fact-top"><h3>仍然未知 / 尚未决定</h3>${badge('不伪装成事实','amber')}</div>${ctx.unknowns.map(x=>`<p class="small">${esc(x)}</p>`).join('')}</div></div>${sectionTitle('待采纳的上下文变化',badge(ctx.proposals.length+' 项','amber'))}${ctx.proposals.map(p=>`<section class="panel pad" style="margin-bottom:14px"><div class="between"><h3 style="margin:0">${esc(p.title)}</h3>${badge('候选','amber')}</div><div class="diff-block"><div class="diff-minus">− ${esc(p.old)}</div><div class="diff-plus">+ ${esc(p.text)}</div></div><div class="source-line">${esc(p.by)} · 根据 ${esc(p.source)}</div><div class="between" style="margin-top:14px"><span class="tiny sub">采纳后形成 v${ctx.revision+1}，不会改写旧运行的依据。</span><div class="inline">${btn('保留未决','reject-proposal','sm',`data-id="${r.id}" data-proposal="${p.id}"`)}${btn('采纳此修改','accept-proposal','primary sm',`data-id="${r.id}" data-proposal="${p.id}"`)}</div></div></section>`).join('')||'<div class="panel"><div class="empty">没有待采纳修改。新的意见仍可继续进入讨论。</div></div>'}${sectionTitle('本次可引用的背景')}<div class="panel pad"><div class="resource">${icon('book')}<div style="flex:1"><h3>${isTeam()?'人工质检 · 采样与状态回查':'学习方法 · 从问题到自测'}</h3><p>知识库只维护一份正文；这里保留用途与版本引用。</p></div>${btn('读取','source','sm',`data-source="knowledge"`)}</div><div class="resource">${icon('code')}<div style="flex:1"><h3>${isTeam()?'质检团队仓 / 相关实现':'个人中心仓 / 关联资料'}</h3><p>本原型未连接仓库，不声称已经取得当前源码。</p></div>${badge('仅示例关联')}</div><div class="resource">${icon('history')}<div style="flex:1"><h3>上下文版本与形成依据</h3><p>工作完成后仍保留，下一项工作引用相关部分。</p></div>${btn('版本历史','context-history','sm',`data-id="${r.id}"`)}</div></div>${sectionTitle('这个上下文如何被使用')}<div class="context-map"><span>工作区 / 领域知识</span><b class="muted">→</b><span class="current">${r.id} · 当前共识 v${ctx.revision}</span><b class="muted">→</b><span>子任务关注点</span><b class="muted">→</b><span>一次运行的只读依据</span></div>`;}
function outputsTab(i){return `<div class="artifact-grid"><div class="artifact-card"><div class="inline muted" style="margin-bottom:10px">${icon(isTeam()?'eye':'file')} ${isTeam()?'可查看的成果':'可阅读的产物'}</div><h3>${isTeam()?'候选界面与解释示例':'学习 / 分析笔记'}</h3><p>先看实际产物，再决定是否需要阅读完整执行记录。</p>${btn('打开成果','artifact','',`data-id="${i.id}"`)}</div><div class="artifact-card"><div class="inline muted" style="margin-bottom:10px">${icon('code')} ${isTeam()?'实现关联':'相关材料'}</div><h3>${isTeam()?'CodeHub MR · 示例占位':'GitHub / 原始材料 · 示例占位'}</h3><p>原型不调用外部接口，也不伪造仓库写入或合并成功。</p>${btn('查看接入边界','source','',`data-source="integration"`)}</div></div>${sectionTitle('要求与验证证据',badge('本页所有结果均为示例','amber'))}<div class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>要证明什么</th><th>为什么要验证</th><th>对应证据</th><th>结论</th></tr></thead><tbody>${i.evidence.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.purpose)}</td><td><button class="text-btn" data-action="evidence" data-id="${i.id}" data-name="${esc(e.name)}">${esc(e.source)}</button></td><td>${status(e.result)}</td></tr>`).join('')}</tbody></table></div><div class="panel-body"><div class="between"><span class="small sub">${i.evidence.filter(e=>e.result==='已证明').length}/${i.evidence.length} 类要求有演示证据；用例数量不代替覆盖说明。</span>${btn(icon('spark')+'委托补充验证','delegate','',`data-id="${i.id}"`)}</div></div></div>${sectionTitle('接受的是结果，不是一次运行')}<div class="panel pad"><p class="small sub">代码或运行结束不会自动完成需求。确认当前范围与证据后，由责任人接受本轮结果。</p><div class="inline">${btn('接受本轮结果','accept-result','primary',`data-id="${i.id}" ${i.state==='已完成'?'disabled':''}`)}${btn('提出结果反馈','feedback','',`data-id="${i.id}" data-anchor="成果与验证"`)}${i.state==='已完成'?status('已完成'):''}</div></div>`;}
function activityTab(i){const r=rootOf(i),runs=db().runs.filter(x=>[i.id,r.id].includes(x.itemId));return `<div class="panel pad"><h2>推进记录</h2><p class="small sub">聚合有意义的变化、决定与运行；不是要求所有工作经过同一个阶段模板。</p><div class="timeline">${(r.activities.length?r.activities:[{time:'09-05',title:'工作已建立',text:'当前上下文与关联材料已登记，等待下一动作。'}]).slice().reverse().map(a=>`<div class="timeline-event"><time>${esc(a.time)}</time><h3>${esc(a.title)}</h3><p>${esc(a.text)}</p></div>`).join('')}</div></div>${sectionTitle('执行尝试与原生会话')}<div class="panel pad">${runs.map(run=>`<div class="run-row"><div class="between"><strong class="mono">${run.id}</strong>${status(run.state)}</div><p class="small" style="margin:8px 0">${esc(run.goal)}</p><div class="mono muted">${esc(run.engine)} · ${esc(run.session)} · 上下文 v${run.rev}</div><div class="between" style="margin-top:10px"><span class="tiny muted">工作目录与本次尝试关联</span>${btn('查看详情','run-detail','sm',`data-id="${run.id}"`)}</div></div>`).join('')||'<div class="empty">尚无运行记录。手动完成的工作也可以关联成果。</div>'}</div>`;}
function retroTab(i){let r=rootOf(i);return `<div class="notice" style="margin-bottom:18px">${icon('refresh')}<div><strong>复盘让这次工作，改变下一次的做法。</strong><br>上下文保留整件事；只有有复用价值且经过验证的部分，才进入知识、Skill 或 Harness。</div></div><div class="panel article"><h2>从本次工作中提取什么</h2><h3>可复用经验</h3><p>${isTeam()?'把“原因无法判断”与“数据已过期”分开，能让讨论更准确。相关经验需要保留适用范围，不能自动推广到所有模块。':'明确一个可回答的问题和一个自测结果，比无界收集资料更容易形成可复用的学习经验。'}</p><h3>需要改进的做法</h3><p>发现重复读材料、遗漏边界或执行偏离时，记录是哪一段能力导致问题，以及用什么案例证明修改有用。</p><div class="inline">${btn('形成改进候选','new-improvement','primary',`data-id="${r.id}"`)}${btn('保留一条复盘记录','feedback','',`data-id="${r.id}" data-anchor="复盘"`)}</div></div>${sectionTitle('本事项的能力改进候选')}${r.improvements.map(p=>improvementCard(p,r.id)).join('')||'<div class="panel"><div class="empty">还没有候选。不要求每件小事都进行完整复盘。</div></div>'}`;}
function improvementCard(p,itemId){return `<div class="retro-row"><div class="between"><div class="inline">${badge(p.kind)}<span class="mono tiny muted">来自 ${itemId}</span></div>${status(p.state)}</div><h3 style="margin-top:12px">${esc(p.title)}</h3><p>${esc(p.body)}</p><div class="tiny muted">目标：${esc(p.target)} · ${esc(p.version)}</div><div class="step-chips"><span class="on">来源问题</span><b class="muted">→</b><span class="on">改进候选</span><b class="muted">→</b><span class="${p.checks?'on':''}">回归验证</span><b class="muted">→</b><span class="${p.state==='已发布'?'on':''}">受审发布</span></div><div class="between"><span class="tiny muted">不修改模型权重，也不自动发布到另一个空间。</span>${btn('查看改进与验证','improvement-detail','sm',`data-id="${itemId}" data-improvement="${p.id}"`)}</div></div>`;}
const knowledgeDocs={context:{title:'持续上下文与长期知识',state:'产品设计建议',body:`<h2>工作记忆和知识库，分别保留什么？</h2><p>事项上下文记录这件事为什么做、当前确认什么、哪里还未知、产生哪些成果。知识库维护能够跨事项复用的定义、规则、运行方法和经验。</p><h3>当前任务不需要复制整个知识库</h3><p>引用适用的知识与来源版本，解释为什么相关。未审视内容明确标记为候选，涉及当前源码行为时回到精确事实源。</p><h3>结束一件事，不等于抹掉工作记忆</h3><p>归档保留原始讨论、关键决定、旧上下文和运行依据。可以另行提取知识变更候选，而不是把整个聊天记录发布成正式知识。</p><div class="notice neutral">本页为原型的设计说明，不是你们现有知识库中的真实页面。</div>`},sampling:{title:'采样计算与实际执行',state:'来自上传材料',body:`<h2>配额计算与真实执行不是同一件事</h2><p>上传的“采样配额与通过打回规则”材料说明：快照计数用于计算最小统计单元的配额，实际执行仍需查询任务级 ID，并在操作后回查状态。</p><h3>前端结果需要表达依据</h3><p>展示计算依据、缺口与更新时间，不把配额计算成功当作外部操作成功。这也是原型中“分配不足解释”假设需求的背景。</p><div class="source-line">来源：05_sampling_rules.txt · 配额计算流程与预览闭环。本文仅作材料阅读示例，未核验当前生产实现。</div>`},methods:{title:'最低充分的知识问答',state:'来自上传材料',body:`<h2>问题决定需要的背景</h2><p>用户提供的 answer-from-knowledge 区分学习全貌、事实判断、缺口判断和任务上下文；普通知识问答不自动创建工作区或变更知识。</p><h3>知识是地图，不是当前运行的替代品</h3><p>精确代码、Schema、接口返回和运行数值，应回到直接事实源。已有知识不足时，说明具体缺口，而不是补写一个听起来合理的答案。</p><div class="source-line">来源：answer-from-knowledge.txt · 第 1、3、4 节。</div>`},personal:{title:'学习与复盘也可以是完整工作',state:'产品设计建议',body:`<h2>无需把个人生活改造成研发流程</h2><p>学习工作可以以“解释一个概念并完成自测”为目标；游戏复盘可以以“定位一次关键决策并形成下局试验”为结果。</p><h3>复用的是共同结构</h3><p>目标、上下文、材料、执行、产物和复盘保持一致。代码仓、MR、容器、多人审阅是可选能力，不是所有事项的必填字段。</p><div class="notice neutral">本页仅定义交互，不提供游戏策略或研究结论。</div>`}};
function knowledgePage(){let keys=isTeam()?['context','sampling','methods']:['context','personal','methods'];if(!keys.includes(ui.knowledge))ui.knowledge=keys[0];let d=knowledgeDocs[ui.knowledge];return pageHead('知识','从已有的 Markdown / llmwiki 浏览、问答和修订。页面不是另一个需要双重维护的知识副本。',btn(icon('message')+'就此问答','chat',''))+`<div class="knowledge-grid"><aside class="panel">${keys.map(k=>`<button class="knowledge-link ${k===ui.knowledge?'active':''}" data-action="knowledge-doc" data-doc="${k}">${icon('file')} ${knowledgeDocs[k].title}<small>${knowledgeDocs[k].state}</small></button>`).join('')}</aside><article class="panel article"><div class="between" style="margin-bottom:20px"><span class="eyebrow">${esc(d.title)}</span>${badge(d.state,d.state==='来自上传材料'?'blue':'amber')}</div>${d.body}<hr class="rule"><div class="between"><span class="small muted">修订先形成候选，不直接覆盖正式知识。</span>${btn('提出知识修订','knowledge-proposal','')}</div></article></div>`;}
function allImprovements(){return roots().flatMap(i=>i.improvements.map(p=>({...p,itemId:i.id})));}
function maintenancePage(){let tabs={abilities:'能力与成长',machines:'执行机',runs:'运行记录',connections:'连接与空间'};return pageHead('维护中心','面向能力与环境维护者。普通成员在事项中委托工作，无须在这里挑选 Agent 编队。',btn(icon('download')+'导出原型数据','export-data',''))+`<div class="tabs">${Object.entries(tabs).map(([k,v])=>`<button class="tab ${ui.maintTab===k?'active':''}" data-action="maint-tab" data-tab="${k}">${v}</button>`).join('')}</div>${({abilities:abilitiesPanel,machines:machinesPanel,runs:runsPanel,connections:connectionsPanel}[ui.maintTab])()}`;}
function abilitiesPanel(){return `<div class="two-cols"><div><div class="panel"><div class="panel-head"><h2>当前登记的能力</h2>${badge('不把“已登记”当作“已验证”','amber')}</div>${db().skills.map(s=>`<div class="list-row"><div style="color:var(--blue)">${icon('spark')}</div><div class="grow"><div class="list-title">${esc(s.name)}</div><div class="list-sub">${esc(s.desc)}</div><div class="tiny muted" style="margin-top:5px">${esc(s.version)}</div></div>${status(s.state)}${btn('边界','skill','sm',`data-name="${esc(s.name)}"`)}</div>`).join('')}</div>${sectionTitle('从工作中生长出来的改进',badge(allImprovements().length+' 项'))}${allImprovements().map(p=>improvementCard(p,p.itemId)).join('')||'<div class="panel"><div class="empty">事项 → 复盘与成长 → 形成改进候选</div></div>'}</div><aside class="panel pad"><h2 style="font-size:14px">不是一个新的 Agent 框架</h2><p class="small sub">Agent 执行继续交给 ${isTeam()?'OpenCode':'Codex / OpenCode'}。这里只管理团队可以委托什么、使用哪个版本、验证到哪里。</p><hr class="rule"><h3>一种能力应当说清楚</h3><p class="small sub">适用问题、输入、知识与工具、输出、停止条件，以及代表性验证案例。</p><h3>发布与升级</h3><p class="small sub">任务记录所用版本。新候选可比较、可拒绝、可回退；不能凭自我总结自动覆盖正式能力。</p></aside></div>`;}
function machinesPanel(){return `<div class="notice neutral" style="margin-bottom:20px">${icon('server')}<div>${isTeam()?'中心机统一派发，成员 Ubuntu 工作站承载容器。下面的资源数值与在线状态均为演示数据。':'个人 WSL 同时承载控制服务与本地执行端；不要求再准备一台中心机。下面为演示登记。'}</div></div><div class="maintenance-grid">${db().machines.map(m=>`<div class="machine"><div class="between">${icon('server')}${status(m.state)}</div><h3 style="margin-top:14px">${esc(m.name)}</h3><span class="mono muted">${m.id}</span><div class="machine-info">环境：${esc(m.image)}<br>演示容量：${m.used} / ${m.slots} 个运行槽位</div><div class="load-bar"><i style="width:${Math.min(100,m.used/m.slots*100)}%"></i></div><div class="between"><span class="tiny muted">停止接单不终止已有运行</span>${btn(m.state==='已暂停'?'恢复接单':'暂停接单','toggle-machine','sm',`data-id="${m.id}" ${m.state==='离线'?'disabled':''}`)}</div></div>`).join('')}</div><div class="notice warning" style="margin-top:20px">${icon('shield')}<div>目录与容器隔离不自动隔离外部数据库、凭证与生产操作。真实执行端仍需限制权限、端口和同时写入。原型不包含远程调度实现。</div></div>`;}
function runsPanel(){return `<div class="panel"><div class="table-wrap"><table class="run-table"><thead><tr><th>运行 / 所属工作</th><th>执行器与原生会话</th><th>执行位置</th><th>上下文</th><th>状态</th><th></th></tr></thead><tbody>${db().runs.map(r=>`<tr><td><strong class="mono">${r.id}</strong><br><button class="text-btn" data-action="open" data-id="${r.itemId}">${r.itemId} · ${esc(getItem(r.itemId)?.title||'已移除')}</button></td><td>${r.engine}<div class="mono muted">${r.session}</div></td><td>${esc(r.machine)}<br><span class="tiny muted">${esc(r.branch)}</span></td><td>v${r.rev}${contextOf(getItem(r.itemId)).revision>r.rev?'<br><span class="tag amber">有新共识</span>':''}</td><td>${status(r.state)}</td><td>${btn('打开','run-detail','sm',`data-id="${r.id}"`)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">尚未启动模拟运行</td></tr>'}</tbody></table></div></div>`;}
function connectionsPanel(){return `<div class="two-cols"><div class="panel article"><h2>${isTeam()?'团队部署':'个人部署'}的接入边界</h2><div class="resource">${icon('code')}<div><h3>${isTeam()?'CodeHub · 质检团队单仓':'GitHub · 中心管理仓 + 独立项目仓'}</h3><p>${isTeam()?'Git 关联和代码管理可先接；MR 自动同步需核实内部接口。':'通过仓库身份与来源版本关联，不要求把所有项目迁进中心仓。'}</p></div>${badge('未接入')}</div><div class="resource">${icon('book')}<div><h3>Markdown / llmwiki</h3><p>复用现有内容与入口；当前未经审视的知识保留候选标记。</p></div>${badge('未接入')}</div><div class="resource">${icon('spark')}<div><h3>${isTeam()?'OpenCode · 内源模型接口':'Codex / OpenCode · 个人执行端'}</h3><p>${isTeam()?'沿用已配置的 URL 与 API Key，不在原型中收集凭证。':'沿用执行端支持的认证；ChatGPT 套餐与平台 API 计费分开。'}</p></div>${badge('未接入')}</div><h3>共享产品，不共享公司数据</h3><p>原型切换两套本地演示数据；正式部署应分离数据库、凭证、知识、执行机与运行记录。经审核的通用能力可以发布到两边，不自动搬运公司材料。</p><div class="export-card"><strong class="small">可以复用的内容</strong><p class="small sub" style="margin:5px 0 0">相同代码版本、通用能力包、页面与视图模板、明确不含敏感信息的测试样例。</p></div></div><aside class="panel pad"><h2 style="font-size:14px">本原型确实做了什么</h2><p class="small sub">本地事项编辑、上下文提案与版本、演示运行、会议编排、快照、个人/团队切换及能力改进候选。</p><h3>没有做什么</h3><p class="small sub">不调用模型，不读真实仓库，不执行容器命令，不实现多人实时同步、权限系统或真正的回归验证。</p>${btn('重置演示数据','reset','')}</aside></div>`;}
const agendaNames={decisions:'需要决定的事',topics:'专题目标与缺口',deliveries:'近期交付与变化'};
function meetingSource(){const m=db().meeting;return m.snapshot?{items:m.snapshot.items,topics:m.snapshot.topics}: {items:roots(),topics:db().topics};}
function agendaKeys(){const m=db().meeting;return m.order.filter(k=>m.enabled.includes(k));}
function itemsForAgenda(key){
 const {items}=meetingSource(),seen=new Set();
 for(const k of agendaKeys()){
  const candidates=k==='decisions'?items.filter(i=>i.attention):k==='deliveries'?items.filter(i=>i.state!=='已完成'):[];
  const selected=candidates.filter(i=>!seen.has(i.id));
  if(k===key)return selected;
  selected.forEach(i=>seen.add(i.id));
 }
 return [];
}
function meetingPage(){const m=db().meeting,keys=agendaKeys();ui.meetingIndex=Math.max(0,Math.min(ui.meetingIndex,keys.length-1));const key=keys[ui.meetingIndex];return pageHead(isTeam()?'质检团队 · 周度组会':'我的周回顾','把议程保存成呈现方式，不再手工搬运一遍进展。',btn('配置议程','agenda-config','')+btn(icon('play')+'开始演示','present','primary'))+`<div class="meeting-controls">${badge(m.snapshot?'已冻结本次内容':'读取当前工作事实',m.snapshot?'green':'blue')}<span class="tiny muted">${m.snapshot?'快照时间 '+esc(m.snapshot.time):'演示周 2026-09-07 至 09-13 · 未连接实际日程'}</span><span class="spacer"></span>${btn(m.snapshot?'回到实时内容':'冻结本次内容','snapshot','sm')}${btn(icon('download')+'导出纪要','export-meeting','sm')}</div><div class="meeting-config"><aside class="panel pad"><div class="eyebrow">本次议程</div>${keys.map((k,ix)=>`<button class="agenda-button ${ix===ui.meetingIndex?'active':''}" data-action="agenda-page" data-index="${ix}"><span class="num">0${ix+1}</span>${agendaNames[k]}</button>`).join('')}<hr class="rule"><p class="small sub">同一事项只在一个板块展开。专题页保留目标与缺口，不重复念子任务。</p><div class="tiny muted">已讨论 ${m.seen.length} 项 · ${m.notes.length} 条会中记录</div></aside><section><div class="slide-page"><div class="slide-eyebrow">${isTeam()?'QC TEAM / WEEKLY ALIGNMENT':'PERSONAL / WEEKLY REVIEW'} · 示例数据</div><h2>${agendaNames[key]||'请选择议程'}</h2><p class="slide-desc">${key==='decisions'?'把需要人的判断放到最前面。进展从事实带入，决定写回原事项。':key==='topics'?'这里只回答目标和整体缺口，不重复展开已经讲过的事项。':'跳过本次前序板块已展开的工作，只呈现剩余近期交付。'}</p>${meetingBody(key)}<div class="slide-footer"><span>共作 · 同一事实，按议程呈现</span><span>${ui.meetingIndex+1} / ${keys.length} ${m.snapshot?'· 已冻结':'· 实时视图'}</span></div></div><div class="between meeting-standard-nav" style="margin-top:15px">${btn('← 上一页','agenda-prev','',`${ui.meetingIndex===0?'disabled':''}`)}<span class="tiny muted">${key==='deliveries'?'专题页不累计事项数；关联不增加新的交付。':'原型演示与模拟运行不会修改任何真实系统。'}</span>${btn('下一页 →','agenda-next','',`${ui.meetingIndex>=keys.length-1?'disabled':''}`)}</div><div class="presentation-nav">${btn('←','agenda-prev','')}<span class="small sub">← → 切页 · Esc 退出</span>${btn('→','agenda-next','')}${btn('退出演示','exit-present','')}</div></section></div><div class="meeting-bottom-note notice neutral" style="margin-top:19px">${icon('meeting')}<div>呈现配置定义“看哪些对象、按什么顺序、展开到哪一层”。冻结快照用于保留当时汇报；会中记录仍关联原事项。这里已实现浏览器演示和 Markdown 纪要导出，未实现 PPTX 导出。</div></div>`;}
function meetingBody(key){const m=db().meeting;if(key==='topics')return meetingSource().topics.map(t=>{let its=meetingSource().items.filter(i=>i.topics.includes(t.name));return `<div class="meeting-item"><div class="between"><h3>${esc(t.name)}</h3><span class="mono muted">${t.due}</span></div><p><strong>阶段目标：</strong>${esc(t.goal)}</p><p><strong>当前缺口：</strong>${esc(its.some(i=>i.state==='已阻塞')?'关键条件尚未补齐，需要先解除阻塞。':its.some(i=>i.attention)?'存在需要确认的边界，见“需要决定的事”。':'仍有结果在推进，证据与剩余工作见对应事项。')}</p><div class="inline tiny muted">${owner(t.owner)}<span>关联 ${its.length} 项结果，仅作引用，不重复展开</span>${its.map(i=>`<button class="text-btn" data-action="peek" data-id="${i.id}">${i.id}</button>`).join('')}</div></div>`;}).join('');return itemsForAgenda(key).map(i=>`<div class="meeting-item ${m.seen.includes(i.id)?'seen':''}"><div class="between"><h3><span class="mono muted">${i.id}</span> ${esc(i.title)}</h3>${m.seen.includes(i.id)?badge('本次已讨论','green'):status(i.state)}</div><p><strong>这次要得到：</strong>${esc(i.goal)}</p><p><strong>最新变化：</strong>${esc(i.update)}</p><div class="between"><div class="inline tiny sub">${owner(i.owner)}<span>目标 ${esc(i.due||'待安排')}</span></div><div class="inline">${btn('查看依据','peek','sm',`data-id="${i.id}"`)}${btn('记录决定','meeting-note','sm',`data-id="${i.id}"`)}${btn(m.seen.includes(i.id)?'撤销已讨论':'标记已讨论','mark-seen','sm',`data-id="${i.id}"`)}</div></div></div>`).join('')||'<div class="empty">本板块没有剩余事项。前面已经展开的内容不再重复。</div>';}
function openModal(title,body,footer='',wide=false){ui.drawer=false;$('#overlay').innerHTML=`<dialog id="modal" ${wide?'style="width:780px"':''}><div class="modal-head"><h2>${esc(title)}</h2>${btn(icon('close'),'close-modal','ghost icon-only','aria-label="关闭弹窗"')}</div><div class="modal-body">${body}</div>${footer?`<div class="modal-foot">${footer}</div>`:''}</dialog>`;$('#modal').showModal();$('#modal').addEventListener('cancel',()=>{setTimeout(()=>$('#overlay').innerHTML='',0)});}
function closeModal(){$('#modal')?.close();$('#overlay').innerHTML='';}
function captureModal(){openModal('先记录，再决定怎样推进',`<label class="label">想法或问题<textarea id="captureText" class="field" placeholder="保留你的原话即可……" autofocus></textarea></label><label class="label">可见范围<select class="field" id="captureScope"><option>个人</option>${isTeam()?'<option>团队</option>':''}</select></label><div class="notice neutral">${icon('idea')}<span>保存后进入灵感池，不创建运行、不查询知识库、不启动完整流程。</span></div>`,btn('保存记录','capture-save','primary'));}
function createIdea(text,scope){const id=(isTeam()?'IDEA-':'PI-')+Date.now().toString(36).toUpperCase();db().ideas.unshift({id,title:text.split('\n')[0].slice(0,85),body:text,state:'待整理',scope,origin:'我 · '+now(),related:null,reason:'尚未分析关联。你可以继续讨论或稍后整理。'});save();return id;}
function newItemModal(ideaId){let idea=db().ideas.find(x=>x.id===ideaId);openModal(idea?'从原始线索形成工作':'新建工作事项',`<label class="label">标题<input class="field" id="itemTitle" value="${esc(idea?.title||'')}" placeholder="希望解决什么问题？"></label><div class="form-grid"><label class="label">工作类型<select class="field" id="itemKind">${['需求','研究','修复','学习','复盘'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="label">责任人<select class="field" id="itemOwner"><option>我</option>${isTeam()?'<option>成员甲</option><option>成员乙</option>':''}</select></label></div><label class="label">这次希望拿到什么结果<textarea class="field" id="itemGoal" placeholder="也可以是调查结论、学习笔记，不一定是代码。"></textarea></label><label class="label">领域<select class="field" id="itemDomain">${db().domains.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><p class="dialog-note">专题、截止时间、仓库与执行环境可以稍后关联，不作为登记门槛。${idea?'原灵感保留，通过来源关系连接。':''}</p>`,btn('建立事项','item-save','primary',`data-idea="${esc(ideaId||'')}"`));}
function relationModal(i){openModal('编辑工作关系',`<div class="notice neutral" style="margin-bottom:16px">${icon('link')}<span>这些关系指向同一事项；增加专题不会复制任务。</span></div><div class="form-grid"><label class="label">责任人<select class="field" id="relationOwner">${[...new Set(['我',...i.participants,...(isTeam()?['成员甲','成员乙']:[])])].map(x=>`<option ${i.owner===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label class="label">目标日期<input type="date" class="field" id="relationDate" value="${esc(i.due)}"></label></div><h3>关联专题（可多选，也可以不选）</h3>${db().topics.map(t=>`<label class="checkline"><input type="checkbox" name="topic" value="${esc(t.name)}" ${i.topics.includes(t.name)?'checked':''}>${esc(t.name)}</label>`).join('')}<h3 style="margin-top:15px">所属领域</h3>${db().domains.map(d=>`<label class="checkline"><input type="checkbox" name="domain" value="${esc(d)}" ${i.domains.includes(d)?'checked':''}>${esc(d)}</label>`).join('')}<label class="label" style="margin-top:15px">影响资产 / 模块（以中文逗号分隔）<input id="relationAssets" class="field" value="${esc(i.assets.join('，'))}"></label>`,btn('保存关系','relations-save','primary',`data-id="${i.id}"`));}
function proposalModal(i){openModal('提出共享上下文修订',`<div class="notice neutral" style="margin-bottom:16px">${icon('history')}<span>当前 v${i.context.revision}。新意见先形成候选，原记录仍然保留。</span></div><label class="label">修改主题<input class="field" id="proposalTitle" placeholder="例如：明确本次验证范围"></label><label class="label">建议的新表述<textarea class="field" id="proposalText" placeholder="说明要改变的理解或约定。"></textarea></label><label class="label">依据或原因<input class="field" id="proposalSource" placeholder="这条建议依据什么反馈或事实？"></label>`,btn('保存为候选','proposal-save','primary',`data-id="${i.id}"`));}
function delegateModal(i){let r=rootOf(i);openModal('委托一次工作',`<div class="notice" style="margin-bottom:18px">${icon('layers')}<div><strong>直接使用 ${r.id} · 共享上下文 v${r.context.revision}</strong><br>目标、范围、相关依据和未决问题自动关联，无须重新粘贴。原型仅模拟，不消耗 Token。</div></div><label class="label">这次具体做什么<textarea class="field" id="runGoal">${isTeam()?'基于当前共识，补充本事项尚未证明的验证场景，并给出结果与不足。':'根据当前问题与材料，完成下一段分析或自测；不扩大为完整综述。'}</textarea></label><div class="form-grid"><label class="label">执行器<select class="field" id="runEngine">${(isTeam()?['OpenCode']:['Codex','OpenCode']).map(x=>`<option>${x}</option>`).join('')}</select></label><label class="label">执行位置<select class="field" id="runMachine">${db().machines.filter(m=>m.state==='在线'&&m.used<m.slots).map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></label></div><label class="label">权限范围<select class="field" id="runPermission"><option>只读分析 / 本地验证，不写外部生产系统</option><option>允许修改独立工作目录，提交前由人确认</option></select></label><p class="dialog-note">责任人仍是 ${esc(i.owner)}。此处只创建演示 Run，不创建真实进程、目录或容器。</p>`,btn('开始模拟委托','delegate-save','primary',`data-id="${i.id}"`));}
function runModal(r){const i=getItem(r.itemId),ctx=contextOf(i);openModal(`${r.id} · 运行与环境`,`${status(r.state)} <span class="tag">模拟运行</span><h3 style="margin-top:16px">${esc(r.goal)}</h3><div class="prop"><span>工作事项</span><div>${r.itemId} · ${esc(i.title)}</div></div><div class="prop"><span>执行器</span><div>${r.engine} / <span class="mono">${r.session}</span></div></div><div class="prop"><span>依据版本</span><div>上下文 v${r.rev} ${ctx.revision>r.rev?badge('当前已经 v'+ctx.revision,'amber'):badge('与当前一致','green')}</div></div><div class="prop"><span>机器 / 环境</span><div>${esc(r.machine)}<br>${esc(r.image)}</div></div><div class="prop"><span>工作目录</span><div class="mono">${esc(r.directory)}</div></div><div class="prop"><span>分支</span><div class="mono">${esc(r.branch)}</div></div><h3>运行事件</h3><pre class="source-code">${esc(r.events.map((x,k)=>`${k+1}. ${x}`).join('\n'))}</pre><p class="dialog-note">同步共识只更新本次委托的输入版本，并保留事件。真实实现仍需校验会话、工具状态与安全恢复点。</p>`,`${ctx.revision>r.rev?btn('同步新共识','sync-run','',`data-id="${r.id}"`):''}${btn(r.state==='已暂停'?'继续模拟':'暂停模拟','toggle-run','',`data-id="${r.id}" ${r.state==='已结束'?'disabled':''}`)}${btn('模拟验证完成','finish-run','primary',`data-id="${r.id}" ${r.state==='已结束'?'disabled':''}`)}`,true);}
function improvementModal(i,p){openModal('能力改进候选',`${badge(p.kind)} ${status(p.state)}<h3 style="margin-top:15px">${esc(p.title)}</h3><p class="small sub">${esc(p.body)}</p><div class="prop"><span>来自工作</span><div>${i.id} · ${esc(i.title)}</div></div><div class="prop"><span>修改对象</span><div>${esc(p.target)} · ${esc(p.version)}</div></div><div class="notice neutral">${icon('shield')}<span>演示通过“样例回归”解锁发布按钮。真实发布需要取得真正执行证据，不得采用模拟结果。</span></div><h3 style="margin-top:18px">候选的验证关注点</h3><div class="accept-list"><div class="accept-row">${icon(p.checks?'check':'circle')}<div>问题案例是否得到改善 ${p.checks?badge('演示通过','green'):badge('未验证','amber')}</div></div><div class="accept-row">${icon(p.checks?'check':'circle')}<div>原来能完成的小任务是否没有变重 ${p.checks?badge('演示通过','green'):badge('未验证','amber')}</div></div></div><p class="dialog-note">发布仅改变本原型中的候选状态；不写入真正的 Skill、Harness 或知识库。</p>`,`${btn('模拟回归验证','test-improvement','',`data-id="${i.id}" data-improvement="${p.id}" ${p.state==='已发布'?'disabled':''}`)}${btn('模拟批准发布','publish-improvement','primary',`data-id="${i.id}" data-improvement="${p.id}" ${!p.checks||p.state==='已发布'?'disabled':''}`)}`);}
function renderDrawer(){let i=ui.page==='detail'?current():null;let chats=i?rootOf(i).chats:[];$('#overlay').innerHTML=`<aside class="drawer" role="dialog" aria-label="就地讨论"><div class="drawer-head">${icon('spark')}<h3>${i?'围绕这件事讨论':'围绕当前内容讨论'}</h3><span class="spacer"></span>${btn(icon('close'),'close-drawer','ghost icon-only','aria-label="关闭讨论"')}</div><div class="drawer-body"><div class="notice neutral" style="margin-bottom:15px"><div><strong>${i?esc(rootOf(i).id)+' · 上下文 v'+contextOf(i).revision:'当前页面 · '+(ui.page==='knowledge'?'知识阅读':'工作整理')}</strong><br>就地引用，不再粘贴一份背景。下面是固定演示回复，不是在线 AI。</div></div><div class="chat-message"><small>AI · 演示说明</small>${i?`我会围绕“${esc(i.title)}”继续。你可以对当前表述提出意见，或者把新发现写成上下文修订候选。`:'可以问当前知识的适用范围，也可以提出修订；问答不自动进入完整研发流程。'}</div>${chats.map(c=>`<div class="chat-message ${c.by==='我'?'user':''}"><small>${esc(c.by)}</small>${esc(c.text)}</div>`).join('')}</div><div class="drawer-foot"><textarea id="chatText" class="field" aria-label="讨论内容" placeholder="指出具体问题，或补充一个事实……"></textarea><div class="between" style="margin-top:10px"><span class="tiny muted">不会调用模型</span>${btn('发送演示消息','chat-send','primary sm')}</div></div></aside>`;}
function download(filename,text,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function peek(i){openModal(`${i.id} · 事项速览`,`<h2>${esc(i.title)}</h2><div class="inline">${status(i.state)}${owner(i.owner)}${badge(i.kind)}</div><h3 style="margin-top:20px">目标</h3><p class="small">${esc(i.goal)}</p><h3>最近变化</h3><p class="small">${esc(i.update)}</p><h3>关联</h3><p class="small sub">专题：${i.topics.map(esc).join('、')||'不要求关联'}<br>领域：${i.domains.map(esc).join('、')}</p><div class="notice neutral">${icon('layers')}<span>共享上下文 v${contextOf(i).revision} · ${contextOf(i).proposals.length} 个候选修改。预览关闭后仍留在原来的列表或组会。</span></div>`,btn('打开完整协作空间','open','primary',`data-id="${i.id}"`));}
function sourceModal(kind){const data={knowledge:['关联知识与来源','此原型从你上传的材料抽取少量背景示例。它没有读取真实 CodeHub 或 GitHub 的知识库。正式产品应记录知识路径、来源版本、适用范围与是否已经审视。'],integration:['关联不等于已经具备外部操作能力','第一层：保存资源身份与链接，能够跳转。第二层：连接器读取外部状态并记录更新时间。第三层：在具备权限和接口时执行动作并回查结果。CodeHub 的内部 MR API、Webhook 和认证方式需要在你们环境实测。原型三层均不连接外部服务。']};const [title,text]=data[kind]||data.knowledge;openModal(title,`<p>${text}</p>`,btn('关闭','close-modal',''));}
function helpModal(){openModal('共作 v0.3 · 原型走查',`<p>可直接离线打开，不需要 npm、账号或 API Key。所有运行、状态、测试、人数和成果都是演示数据。</p><h3>建议体验的四条路径</h3><p class="small">我的工作 → 查看上下文变化 → 采纳候选 → 推进记录，观察旧 Run 的依据版本。<br>工作事项 → 专题分组 → 周度组会，观察跨专题工作怎样避免重复展开。<br>事项 → 委托 AI → 模拟验证完成 → 接受结果 → 复盘与成长。<br>左上切换个人版，查看学习、实验、游戏事项，以及同一套维护入口。</p><h3>交互与保存</h3><p class="small">原型数据保存在当前浏览器的 localStorage。可导出 JSON；团队版和个人版的样例数据分别保存。文件模式下若浏览器限制存储，使用本地 HTTP 服务打开。</p><h3>不是产品承诺</h3><p class="small">没有真实模型、仓库、容器、协同编辑、鉴权或调度连接。会议支持在线演示与 Markdown 纪要，不生成 PPTX。</p>`,btn('开始查看','close-modal','primary'),true);}
const actions={
nav:e=>{closeModal();go(e.dataset.page);},
open:e=>{closeModal();go('detail',e.dataset.id,e.dataset.tab||'overview');},

'mobile-nav':()=>openModal('导航',`<div class="stack">${[['home','我的工作'],['work','工作事项'],['ideas','灵感与讨论'],['knowledge','知识'],['meeting',isTeam()?'周度组会':'周回顾'],['maintenance','维护中心']].map(([p,n])=>btn(n,'nav','',`data-page="${p}"`)).join('')}</div><hr class="rule">${btn(isTeam()?'切换个人版':'切换团队版','mobile-switch','')}`),

capture:captureModal,

'quick-save':()=>{let t=$('#quickCapture').value.trim();if(!t)return toast('请先写下一句话。');createIdea(t,'个人');render();toast('已加入个人灵感；没有启动运行。');},
'new-item':()=>newItemModal(),
promote:e=>newItemModal(e.dataset.id),
'item-save':e=>{let title=$('#itemTitle').value.trim(),goal=$('#itemGoal').value.trim();if(!title||!goal)return toast('请填写标题和这次希望得到的结果。');let id=(isTeam()?'QC-':'P-')+Date.now().toString(36).slice(-5).toUpperCase();let n=item(id,title,$('#itemKind').value,$('#itemDomain').value,[],$('#itemOwner').value,'待确认','', '已形成目标，尚未承诺排期',goal,'范围待继续澄清。');n.participants=['我'];n.assets=[];n.context=seedContext(goal,n.scope);n.context.revision=1;n.context.history=[{rev:1,text:'从当前输入建立事项',by:'我',time:now()}];n.evidence.forEach(x=>{x.result='未验证';x.source='等待明确';});db().items.unshift(n);const ide=db().ideas.find(x=>x.id===e.dataset.idea);if(ide){ide.related=id;ide.state='已有后续';activity(n,'从灵感形成工作','来源 '+ide.id+'；原始记录保留。');}save();closeModal();go('detail',id);toast('事项已建立，未自动排期或运行。');},
'idea-discuss':e=>{let i=db().ideas.find(x=>x.id===e.dataset.id);openModal('继续讨论这条线索',`<h3>${esc(i.title)}</h3><p class="small sub">${esc(i.body)}</p><label class="label">补充一条观点<textarea id="ideaComment" class="field" placeholder="哪些问题还没想清楚？可以与什么工作关联？"></textarea></label>`,btn('保存讨论','idea-comment-save','primary',`data-id="${i.id}"`));},
'idea-comment-save':e=>{let txt=$('#ideaComment').value.trim();if(!txt)return toast('请先写下观点。');const i=db().ideas.find(x=>x.id===e.dataset.id);i.body+='\n\n补充：'+txt;if(!i.related)i.state='讨论中';save();closeModal();render();toast('观点已留在原始线索下。');},
'work-tab':e=>{ui.workTab=e.dataset.tab;render();},
'work-kind':e=>{ui.kind=e.dataset.kind;render();},
'filter-topic':e=>{ui.filter=e.dataset.topic;ui.group='none';ui.workTab='items';go('work');},
'save-view':()=>{store.savedFilters[store.workspace]={group:ui.group,filter:ui.filter,kind:ui.kind};save();toast('已保存本空间的事项呈现；没有复制任何工作。');},
'detail-tab':e=>{ui.tab=e.dataset.tab;setHash();render();},
'edit-relations':e=>relationModal(getItem(e.dataset.id)),
'relations-save':e=>{let i=getItem(e.dataset.id);i.owner=$('#relationOwner').value;i.due=$('#relationDate').value;i.topics=[...document.querySelectorAll('[name="topic"]:checked')].map(n=>n.value);i.domains=[...document.querySelectorAll('[name="domain"]:checked')].map(n=>n.value);i.assets=$('#relationAssets').value.split(/[，,]/).map(x=>x.trim()).filter(Boolean);activity(i,'调整工作关系','责任、专题、领域与资产分别保存；事项 ID 不变。');save();closeModal();render();toast('关系已更新，各视图将读取相同事实。');},
propose:e=>proposalModal(getItem(e.dataset.id)),
'proposal-save':e=>{const title=$('#proposalTitle').value.trim(),text=$('#proposalText').value.trim();if(!title||!text)return toast('请填写主题与建议表述。');const i=getItem(e.dataset.id);i.context.proposals.push({id:'p'+Date.now(),title,text,old:'当前确认内容保持不变；本条为新增或修订候选。',by:'我',source:$('#proposalSource').value.trim()||'本次讨论（依据待补）'});i.attention=true;activity(i,'提出上下文修订候选',title);save();closeModal();render();toast('候选已保存，尚未改变当前共识。');},
'accept-proposal':e=>{const i=getItem(e.dataset.id),ctx=i.context,p=ctx.proposals.find(p=>p.id===e.dataset.proposal);ctx.decisions.push({title:p.title,body:p.text,source:p.source});ctx.revision++;ctx.history.unshift({rev:ctx.revision,text:p.title,by:'我',time:now()});ctx.proposals=ctx.proposals.filter(x=>x.id!==p.id);i.attention=ctx.proposals.length>0;i.update='已确认新的表达边界；现有运行需检查是否同步新共识';activity(i,'采纳上下文 v'+ctx.revision,p.title+'。旧运行仍引用旧版本。');save();render();toast('已形成新的共识版本；没有悄悄覆盖旧 Run 的依据。');},
'reject-proposal':e=>{const i=getItem(e.dataset.id),p=i.context.proposals.find(x=>x.id===e.dataset.proposal);i.context.unknowns.push(p.title+'：'+p.text+'（暂不采纳，保留讨论）');i.context.proposals=i.context.proposals.filter(x=>x.id!==p.id);activity(i,'保留未决意见',p.title);save();render();toast('未进入正式共识，原意见保留为未决。');},
'context-history':e=>{let i=getItem(e.dataset.id);openModal('共享上下文版本',`<div class="timeline">${i.context.history.map(h=>`<div class="timeline-event"><time>${esc(h.time)} · ${esc(h.by)}</time><h3>v${h.rev} · ${esc(h.text)}</h3></div>`).join('')}</div><p class="dialog-note">原型展示修订历史；完整版本内容与并发合并未实现。</p>`,btn('关闭','close-modal',''));},
feedback:e=>{let i=getItem(e.dataset.id);openModal('对当前内容留下反馈',`<div class="notice neutral" style="margin-bottom:15px">${icon('message')}<span>${i.id} / ${esc(e.dataset.anchor||'当前事项')} / 上下文 v${contextOf(i).revision}</span></div><label class="label">意见<textarea class="field" id="feedbackText" placeholder="指出具体问题，保留依据……"></textarea></label>`,btn('保存反馈','feedback-save','primary',`data-id="${i.id}" data-anchor="${esc(e.dataset.anchor||'当前事项')}"`));},
'feedback-save':e=>{let txt=$('#feedbackText').value.trim();if(!txt)return toast('请先填写意见。');let i=getItem(e.dataset.id);rootOf(i).chats.push({by:'我',text:e.dataset.anchor+'：'+txt});activity(i,'新增内容反馈',e.dataset.anchor+' · '+txt);save();closeModal();render();toast('反馈已关联当前内容；没有自动改写需求。');},
delegate:e=>delegateModal(getItem(e.dataset.id)),
'delegate-save':e=>{const i=getItem(e.dataset.id),goal=$('#runGoal').value.trim(),machine=db().machines.find(x=>x.id===$('#runMachine').value);if(!goal)return toast('请说明这次要做什么。');if(!machine||machine.state!=='在线'||machine.used>=machine.slots)return toast('当前没有可用执行位置。');let id='RUN-'+Date.now().toString(36).slice(-5).toUpperCase();let r={id,itemId:i.id,goal,machine:machine.id,engine:$('#runEngine').value,session:'ses_demo_'+Date.now().toString(36),rev:contextOf(i).revision,state:'运行中',image:machine.image,directory:`/workspaces/${i.id}/attempt-${db().runs.length+1}/repo`,branch:i.assets.some(x=>x.includes('仓'))?'work/'+i.id:'无需代码分支',created:now(),permission:$('#runPermission').value,events:['已建立模拟委托','关联共享上下文 v'+contextOf(i).revision,'等待你模拟下一步；没有真实工具运行']};db().runs.unshift(r);machine.used++;activity(i,'启动模拟委托 '+id,goal);save();closeModal();ui.tab='activity';render();toast('演示 Run 已建立；没有调用模型或启动容器。');},
'run-detail':e=>runModal(db().runs.find(x=>x.id===e.dataset.id)),
'sync-run':e=>{let r=db().runs.find(x=>x.id===e.dataset.id),old=r.rev;r.rev=contextOf(getItem(r.itemId)).revision;r.events.push(`显式同步上下文：v${old} → v${r.rev}`);save();closeModal();render();runModal(r);},
 'toggle-run':e=>{let r=db().runs.find(x=>x.id===e.dataset.id);r.state=r.state==='已暂停'?'运行中':'已暂停';r.events.push('用户'+r.state+'（演示）');save();closeModal();render();runModal(r);},
'finish-run':e=>{const r=db().runs.find(x=>x.id===e.dataset.id);r.state='已结束';r.events.push('模拟验证已完成；不是实际运行证据');const m=db().machines.find(x=>x.id===r.machine);if(m)m.used=Math.max(0,m.used-1);const i=getItem(r.itemId);i.evidence.forEach(ev=>{ev.result='已证明';ev.source=r.id+' · 演示证据';});i.state='待验收';i.update='演示验证已结束，等待责任人接受结果';activity(i,'模拟运行结束',r.id+'；技术执行结束不自动完成事项。');save();closeModal();render();toast('模拟结果已回到事项；仍需接受本轮成果。');},
'accept-result':e=>{let i=getItem(e.dataset.id),missing=i.evidence.some(e=>e.result!=='已证明');if(missing)return openModal('还有未证明的要求',`<p>当前有证据缺口，不能把它直接当作全部满足。</p><p class="small sub">在原型中先通过“委托 AI → 运行详情 → 模拟验证完成”走通证据回传，再体验接受结果。真实产品也可以显式缩小交付范围，但不能静默修改标准。</p>`,btn('关闭','close-modal',''));openModal('接受本轮结果',`<h3>${esc(i.title)}</h3><p>这会把演示事项标记为已完成，保留上下文、成果和运行记录。不会自动发布复盘候选，也不会合并真实代码。</p>`,btn('确认接受（演示）','confirm-accept','primary',`data-id="${i.id}"`));},
'confirm-accept':e=>{let i=getItem(e.dataset.id);i.state='已完成';i.attention=false;i.update='本轮结果已接受；上下文与证据保留，可继续复盘';activity(i,'接受本轮结果','负责人在演示环境接受本轮范围。');save();closeModal();ui.tab='retro';render();toast('已接受演示结果，可以形成复盘与改进候选。');},
artifact:e=>{let i=getItem(e.dataset.id);openModal('成果预览 · 示例',isTeam()?`<div class="preview-sample"><h3>验收分配预览</h3><div class="preview-stats"><div><span class="tiny muted">目标数量</span><strong>100</strong></div><div><span class="tiny muted">当前可用</span><strong>60</strong></div><div><span class="tiny muted">缺口</span><strong>40</strong></div></div><div class="notice warning">${icon('clock')}<span>依据最近一次快照计算，非实时结果。来源时间：2026-09-05 10:00。</span></div><p class="small sub" style="margin-top:13px">本示例只解释缺口，不会执行真实分配。</p></div>`:`<article><h2>${esc(i.title)}</h2><p>问题：${esc(i.goal)}</p><h3>下一段笔记</h3><p>从一个明确例子开始，记录自己的解释、引用材料、仍不确定的地方，以及能够检验理解的问题。</p><div class="notice neutral">这是产物形态示例，不是对论文或游戏的事实解读。</div></article>`,btn('留下反馈','feedback','',`data-id="${i.id}" data-anchor="成果预览"`),true);},
evidence:e=>{let i=getItem(e.dataset.id),ev=i.evidence.find(x=>x.name===e.dataset.name);openModal('验证证据 · 演示',`<h3>${esc(ev.name)}</h3><p>${esc(ev.purpose)}</p><div class="prop"><span>当前状态</span><div>${status(ev.result)}</div></div><div class="prop"><span>证据引用</span><div>${esc(ev.source)}</div></div><div class="notice warning">${icon('shield')}<span>这是原型数据，不能证明真实代码或业务行为。正式报告应固定成果版本、环境、输入、预期、实际结果和未覆盖范围。</span></div>`,btn('关闭','close-modal',''));},
source:e=>sourceModal(e.dataset.source),
'new-improvement':e=>openModal('形成能力改进候选',`<label class="label">改进哪一层<select class="field" id="impKind"><option>Skill</option><option>知识</option><option>Agent 配置</option><option>Harness / 流程</option></select></label><label class="label">候选名称<input id="impTitle" class="field" value="减少重复读取，保留关键验证"></label><label class="label">问题、修改方向与验证方法<textarea class="field" id="impBody">这次发现重复读取了已经确认的背景。建议优先读取事项上下文与新增差异，用局部小任务和边界案例验证是否减少无效步骤。</textarea></label><label class="label">要修改的能力<input class="field" id="impTarget" value="已有工作方式"></label><p class="dialog-note">来源事项 ${esc(e.dataset.id)} 自动关联。不创建新的 Agent，除非实际需要。</p>`,btn('保存候选','improvement-save','primary',`data-id="${e.dataset.id}"`)),
'improvement-save':e=>{const title=$('#impTitle').value.trim(),body=$('#impBody').value.trim();if(!title||!body)return toast('请填写候选名称与问题说明。');const i=getItem(e.dataset.id);i.improvements.push({id:'imp-'+Date.now(),kind:$('#impKind').value,title,body,target:$('#impTarget').value||'待明确',version:'当前版本 → 候选下一版',state:'待补证',checks:0});activity(i,'形成能力改进候选',title);save();closeModal();render();toast('候选已进入维护中心，尚未发布。');},
'improvement-detail':e=>{let i=getItem(e.dataset.id);improvementModal(i,i.improvements.find(x=>x.id===e.dataset.improvement));},

 'maint-tab':e=>{ui.maintTab=e.dataset.tab;render();},
 'toggle-machine':e=>{let m=db().machines.find(x=>x.id===e.dataset.id);m.state=m.state==='在线'?'已暂停':'在线';save();render();toast('已更新演示接单状态；没有操作实际机器。');},
 skill:e=>{let s=db().skills.find(s=>s.name===e.dataset.name);openModal('能力登记 · '+s.name,`<p>${esc(s.desc)}</p><div class="prop"><span>版本</span><div>${esc(s.version)}</div></div><p class="small sub">这个原型只展示登记与成长机制，不根据上传文件推断内部能力已经完成生产验证。</p>`,btn('关闭','close-modal',''));},

 'agenda-page':e=>{ui.meetingIndex=Number(e.dataset.index);render();},

 present:()=>{ui.present=true;render();window.scrollTo(0,0);},
 'exit-present':()=>{ui.present=false;render();},
 'agenda-config':()=>{let m=db().meeting;openModal('配置会议呈现',`<p class="small sub">只配置读取与讲述方式，不再建立一份周报事实。</p><div id="agendaEdit">${m.order.map((k,n)=>`<div class="between" style="margin:8px 0" data-key="${k}"><label class="checkline"><input type="checkbox" name="agendaEnabled" value="${k}" ${m.enabled.includes(k)?'checked':''}>${agendaNames[k]}</label><div class="inline">${btn('↑','agenda-up','sm',`data-key="${k}"`)}${btn('↓','agenda-down','sm',`data-key="${k}"`)}</div></div>`).join('')}</div><div class="notice neutral" style="margin-top:16px">${icon('layers')}<span>按议程顺序分配事项首次展开的位置；专题页只提供目标级摘要。该原型提供三种板块，不是任意仪表盘编辑器。</span></div>`,btn('保存议程','agenda-save','primary'));},
 'agenda-up':e=>{let row=e.closest('#agendaEdit > [data-key]');if(row.previousElementSibling)row.parentNode.insertBefore(row,row.previousElementSibling);},
 'agenda-down':e=>{let row=e.closest('#agendaEdit > [data-key]');if(row.nextElementSibling)row.parentNode.insertBefore(row.nextElementSibling,row);},
 'agenda-save':()=>{let enabled=[...document.querySelectorAll('[name="agendaEnabled"]:checked')].map(e=>e.value);if(!enabled.length)return toast('至少保留一个议程板块。');db().meeting.order=[...$('#agendaEdit').children].map(x=>x.dataset.key);db().meeting.enabled=enabled;ui.meetingIndex=0;save();closeModal();render();toast('议程已保存；不同顺序仍会去重展开。');},
 snapshot:()=>{let m=db().meeting;if(m.snapshot)m.snapshot=null;else m.snapshot={time:now(),items:JSON.parse(JSON.stringify(roots())),topics:JSON.parse(JSON.stringify(db().topics))};save();render();toast(m.snapshot?'已冻结这次读取的工作事实。':'已恢复读取当前事项。');},
 'mark-seen':e=>{let m=db().meeting;m.seen=m.seen.includes(e.dataset.id)?m.seen.filter(x=>x!==e.dataset.id):[...m.seen,e.dataset.id];save();render();},
 'meeting-note':e=>openModal('把会中决定关联回事项',`<p class="small sub">${esc(e.dataset.id)} · ${esc(getItem(e.dataset.id).title)}</p><label class="label">决定或行动项<textarea class="field" id="meetingNote" placeholder="写清这次确认什么，或者谁需要补充什么。"></textarea></label><p class="dialog-note">会议记录加入活动历史；涉及需求共识变更时仍可继续提出修订。</p>`,btn('保存会中记录','meeting-note-save','primary',`data-id="${e.dataset.id}"`)),
 'meeting-note-save':e=>{let t=$('#meetingNote').value.trim();if(!t)return toast('请填写决定或行动项。');let m=db().meeting;m.notes.push({id:e.dataset.id,text:t,time:now()});if(!m.seen.includes(e.dataset.id))m.seen.push(e.dataset.id);activity(getItem(e.dataset.id),'组会记录',t);save();closeModal();render();toast('记录已写回原事项，不需另行粘贴。');},
 'export-meeting':()=>{const m=db().meeting,src=meetingSource();let txt=`# ${isTeam()?'质检团队周度组会':'个人周回顾'}\n\n> 离线原型示例，非真实业务状态。\n\n${m.snapshot?'冻结时间：'+m.snapshot.time:'导出时间：'+now()}\n\n`;for(const k of agendaKeys()){txt+='## '+agendaNames[k]+'\n\n';if(k==='topics'){for(const t of src.topics)txt+=`### ${t.name}\n\n阶段目标：${t.goal}\n\n目标日期：${t.due}\n\n`;}else for(const i of itemsForAgenda(k))txt+=`### ${i.id} ${i.title}\n\n目标：${i.goal}\n\n进展：${i.update}\n\n责任人：${i.owner}；目标日期：${i.due}\n\n`;}txt+='## 会中记录\n\n'+(m.notes.map(n=>`### ${n.id}\n\n${n.text}\n\n${n.time}`).join('\n\n')||'暂无记录。');download('共作-组会纪要-演示.md',txt);toast('已导出当前会议的 Markdown 纪要。');},
 'export-data':()=>{download('共作-原型数据.json',JSON.stringify(store,null,2),'application/json;charset=utf-8');toast('已导出两套原型数据，不包含任何真实服务凭证。');},
 reset:()=>openModal('重置演示数据',`<p>清除本浏览器中本原型的事项修改、会议与模拟运行，恢复初始示例。不会操作其他文件或系统。</p>`,btn('确认重置','reset-confirm','primary')),
 'reset-confirm':()=>{store=seed();save();closeModal();go('home');toast('已恢复初始示例。');},
 chat:()=>{ui.drawer=true;renderDrawer();},
 'close-drawer':()=>{ui.drawer=false;$('#overlay').innerHTML='';},
 'chat-send':()=>{let text=$('#chatText').value.trim();if(!text)return;let i=ui.page==='detail'?rootOf(current()):null;if(i){i.chats.push({by:'我',text});i.chats.push({by:'AI · 固定演示回复',text:'这条意见已留在当前事项下。涉及共同理解的改变，可以使用“共享上下文 → 提出修订”；不会自动改写已确认内容。本回复是原型预置内容。'});save();renderDrawer();}else{$('.drawer-body').insertAdjacentHTML('beforeend',`<div class="chat-message user"><small>我</small>${esc(text)}</div><div class="chat-message"><small>固定演示回复</small>当前是离线原型，没有调用模型。知识问答应引用当前阅读内容，修订则形成独立候选。</div>`);$('#chatText').value='';}},
 search:()=>{openModal('查找',`<input id="globalSearch" class="field" aria-label="搜索事项" placeholder="输入事项标题或 ID……" autofocus><div id="searchResults" class="search-results" style="margin-top:10px">${roots().map(i=>`<button data-action="open" data-id="${i.id}"><span class="mono muted">${i.id}</span> ${esc(i.title)}</button>`).join('')}</div><p class="dialog-note">搜索当前空间的演示事项，不跨公司与个人数据。</p>`);},
 'close-modal':closeModal
};
document.addEventListener('click',ev=>{let e=ev.target.closest('[data-action]');if(e&&!e.disabled&&actions[e.dataset.action]){try{actions[e.dataset.action](e);}catch(error){console.error(error);toast('这次演示操作未完成，可刷新页面重试。');}}});
document.addEventListener('change',e=>{if(e.target.id==='workspace'){store.workspace=e.target.value;save();let f=store.savedFilters[store.workspace]||{};Object.assign(ui,{group:f.group||'none',filter:f.filter||'',kind:f.kind||'all',maintTab:'abilities',knowledge:'context',workTab:'items'});go('home');}if(e.target.id==='workGroup'){ui.group=e.target.value;render();}if(e.target.id==='workFilter'){ui.filter=e.target.value;render();}});
document.addEventListener('input',e=>{if(e.target.id==='globalSearch'){const q=e.target.value.toLowerCase();$('#searchResults').innerHTML=db().items.filter(i=>(i.id+i.title).toLowerCase().includes(q)).map(i=>`<button data-action="open" data-id="${i.id}"><span class="mono muted">${i.id}</span> ${esc(i.title)}</button>`).join('')||'<div class="empty">没有找到匹配的事项。</div>';}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();actions.search();}if(e.key==='Escape'&&ui.present){ui.present=false;render();}else if(e.key==='Escape'&&ui.drawer){ui.drawer=false;$('#overlay').innerHTML='';}if(ui.present&&!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)){if(e.key==='ArrowRight')actions['agenda-next']();if(e.key==='ArrowLeft')actions['agenda-prev']();}});
window.addEventListener('hashchange',()=>{fromHash();render();});
fromHash();{const f=store.savedFilters[store.workspace]||{};ui.group=f.group||'none';ui.filter=f.filter||'';ui.kind=f.kind||'all';}render();
</script></body></html>
