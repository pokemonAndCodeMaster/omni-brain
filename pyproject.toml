[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quality-platform-lab"
version = "0.1.0"
description = "Local manual quality-control platform experiment"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
