# knowledge/taxonomy.yaml
# omni-brain 知识分类法
# OKF 兼容（type 字段对应 OKF 规范），其余为 omni-brain 自有约定
#
# 演进规则：
#   - 增删 type / domain / relation_type 需要人工审批
#   - AI 可提出变更提案，格式见文件末尾
# 版本：1.0  日期：2026-07-06

# ─────────────────────────────────────────────────────────────
# 知识类型（对应 OKF 的 type 字段，值自由但需自描述）
# ─────────────────────────────────────────────────────────────
types:

  # ── 通用知识类型 ──
  Concept:    "概念卡——理论、方法、术语的核心原则（对多人有效的通用知识）"
  Source:     "来源摘要卡——对一篇原始资料（论文/文档/文章）的结构化提炼"
  Entity:     "实体卡——人物、组织、产品、项目的事实性描述"
  Synthesis:  "综合分析卡——跨多来源的主题整合、对比框架或结构化洞察"
  Norm:       "操作规范卡——强制要求的操作步骤或参数约定（必须填 affects_path）"
  Pitfall:    "避坑指南卡——踩坑记录和反直觉约束（必须填 affects_path）"
  Playbook:   "操作手册卡——端到端完整操作流程指南"
  CodeModule: "代码模块卡——代码架构的知识描述（必须填 related_code 和 code_hash）"
  Hub:        "枢纽卡——目录导航和总览，只含链接不含具体细节"
  Reference:  "参考卡——外部工具/文档/规范的引用和使用说明"

  # ── 经历记忆类型（来自个人经历，直接形成知识）──
  Experience: "经历卡——来自真实任务、错误修复或对话的一手经验，含场景、行动和结论"
  Preference: "偏好卡——个人习惯、工具偏好、编码风格、工作流倾向"
  Context:    "背景卡——关于我/环境/团队/项目的长期稳定事实"

# ─────────────────────────────────────────────────────────────
# 业务域（domain 字段，支持多域，填列表）
# ─────────────────────────────────────────────────────────────
domains:
  # AI 与机器学习
  - agent_engineering        # AI Agent 工程（设计模式、工作流、评估）
  - machine_learning         # 机器学习（模型训练、优化、架构）
  - multimodal_llm           # 多模态大模型（视觉、音频、跨模态）
  - knowledge_mgmt           # 知识管理与记忆系统

  # 软件工程
  - software_engineering     # 通用软件工程（设计模式、架构原则）
  - backend_dev              # 后端开发（Python、FastAPI、数据库）
  - frontend_dev             # 前端开发（Vue3、React、TypeScript）
  - devops                   # 运维与部署（CI/CD、Docker、Linux）
  - distributed_systems      # 分布式系统（一致性、消息队列、微服务）

  # 个人与方法论
  - learning_methods         # 学习方法论（费曼、间隔重复、主动召回）
  - personal_productivity    # 个人效率与习惯
  - project_mgmt             # 项目管理

  # 项目专属（按需动态添加，格式：project_<name>）
  # 例：project_spider_dev, project_llm_base

  # 系统元知识
  - meta                     # omni-brain 自身的规范、配置、操作指南

# ─────────────────────────────────────────────────────────────
# 关系类型（relations 字段的 type 枚举）
# ─────────────────────────────────────────────────────────────
relation_types:
  supports:     "新内容印证或支持目标观点"
  contradicts:  "新内容与目标内容矛盾（冲突，需关注）"
  supersedes:   "新内容取代目标旧内容"
  depends_on:   "依赖关系（使用或建立在目标之上）"
  related:      "一般关联（不明确支持/反驳）"
  derived_from: "从目标内容发展或演化而来"
  exemplifies:  "是目标概念的具体实例"
  implements:   "是目标规范/架构的具体实现"

# ─────────────────────────────────────────────────────────────
# 状态枚举（status 字段）
# ─────────────────────────────────────────────────────────────
statuses:
  active:     "当前有效，内容与现实一致"
  draft:      "草稿，尚未经过验证或审核"
  stale:      "内容可能已过时，等待更新"
  superseded: "已被新卡片取代，保留作历史参考"

# ─────────────────────────────────────────────────────────────
# 来源类型（source.type 字段）
# ─────────────────────────────────────────────────────────────
source_types:
  article:          "外部文章、博客或教程"
  paper:            "学术论文"
  documentation:    "官方文档"
  github:           "GitHub 仓库或 Issue"
  conversation:     "AI 对话或讨论记录"
  task_execution:   "真实任务执行过程中的观察"
  manual:           "人工直接编写，无特定来源"
  notebooklm:       "从 NotebookLM 笔记中提取"

# ─────────────────────────────────────────────────────────────
# 待审批演进提案（AI 可在此追加提案，格式如下）
# ─────────────────────────────────────────────────────────────
# proposals:
#   - date: YYYY-MM-DD
#     type: new_type | new_domain | modify_relation
#     name: 提案名称
#     reason: 为什么需要
#     value: 建议的值和描述
#     status: pending
