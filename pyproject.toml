[project]
name = "omni-brain"
version = "0.1.0"
description = "Personal AI Operating System — unified knowledge, skills, and evolution"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "PyYAML>=6.0.1",
    "uvicorn>=0.34.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "eval"]
python_files = ["test_*.py", "*_test.py"]
