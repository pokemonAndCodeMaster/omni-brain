  - id: Q7-04
    scenario: Q7
    critical: false
    question: 是否说明总容量只有12时最终目标降为12、总量 shortage 为8且必须显式告知？
  - id: Q7-05
    scenario: Q7
    critical: false
    question: 是否使用绝对可点击的采样与分配规范页？
  - id: Q8-01
    scenario: Q8
    critical: true
    question: 是否明确不能确认空库执行固定 migration 后可跑通查询和 Ratio 预览？
  - id: Q8-02
    scenario: Q8
    critical: true
    question: 是否说明固定 migration 只建 delivery_task、operation_preview、portal_view_config，没有创建 Repository 查询的 daily_snapshot？
  - id: Q8-03
    scenario: Q8
    critical: true
