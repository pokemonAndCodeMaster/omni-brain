app:
  name: Quality Platform Lab
  environment: local
  schema_version: snapshot-jsonb-v20260709

logging:
  level: ${QC_LOG_LEVEL:INFO}

database:
  default: primary
  connections:
    primary:
      driver: postgresql
      host: ${QC_DB_HOST:.runtime/postgres/socket}
      port: ${QC_DB_PORT:55432}
      database: ${QC_DB_NAME:quality_lab}
      user: ${QC_DB_USER:quality_lab}
      password: ${QC_DB_PASSWORD:}
      schema: ${QC_DB_SCHEMA:manual_qc_lab}
      min_size: 1
      max_size: 5

external_tasks:
  mode: mock

object_storage:
  mode: disabled

agent_runtime:
  registry_path: ${OMNI_AGENT_REGISTRY:../omni-brain/config/agent-registry.yaml}
  worktree_root: ${OMNI_RUN_ROOT:../.omni-brain-runs}
  artifact_root: ${OMNI_RUN_ARTIFACT_ROOT:.runtime/agent-runs}
  opencode:
    command: ${OPENCODE_COMMAND:opencode}
    endpoint: ${OPENCODE_ENDPOINT:}
