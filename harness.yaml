schema_version: '0.4'
name: omni-brain-harness
release_channel: release
release_id: m1-ingestion-harness-v1
release_date: '2026-08-03'
roadmap: docs/roadmap.md

current_stage:
  id: M1
  status: released_verified_at_quality_check_incremental_slice
  outcome: 混乱真实材料形成可浏览、可查询、可追溯且细节不失真的规范知识

runtime:
  primary: opencode
  adapter: native_file_conventions
  instructions: AGENTS.md
  skills_root: .agents/skills
  opencode_specific_config_required: false

capabilities:
  task_case:
    adoption: verified_at_recovery_and_atomic_answer_slices
    entrypoints:
      - .agents/skills/task-knowledge-prep/SKILL.md
      - scripts/task_case.py
    limits:
      - 尚缺跨模型和跨领域稳定证据
      - 语义准备度仍由 Agent 和人判断
  local_git_source_run:
    adoption: implemented_l1_local_git_slice
    entrypoints:
      - scripts/source_run.py
    limits:
      - 只记录显式本地 Git 范围、版本和覆盖
      - 不理解或摄入知识语义
  knowledge_base:
    adoption: implemented_empty_okf_scaffold
    entrypoints:
      - knowledge/index.md
      - config/knowledge-domains.yaml
    limits:
      - 当前没有正式领域知识或已验证产品视图
      - 目录名和领域地图是 Omni-Brain 约定，不是 OKF 标准 taxonomy
  knowledge_ingestion:
    adoption: verified_at_cross_model_incremental_slice
    entrypoints:
      - .agents/skills/ingest-knowledge/SKILL.md
      - scripts/ingestion_workspace.py
      - scripts/knowledge_check.py
    limits:
      - 宽范围完整整理把不重复叙述文档作为独立审阅单元；完全重复仍合并，代码与配置按有界依赖组阅读
      - 读后发现、必要细节、知识归属和正文表达仍由 Agent 语义完成；工具只能校验来源、顺序、唯一归属、真实标题和一致性
      - 完整模式的来源追溯页从已校验发现和正文落点重建，不由模型维护第二份路径清单
      - 新摄入案继承正式知识和领域配置的父版本快照；create/update/merge 与父路径关系及候选差异可检查
      - 聚焦问题召回只使用关键词、标题、正文命中和有限 import，不包含向量或完整代码图
      - 隔离运行支持现场只读引用和私有可写副本；环境绑定结果不能冒充固定基线
      - 只有实际作用于来源项目的运行才能作为其证据，Harness 自身测试不能冒充来源实现结果
      - 只读检查不判断业务真伪或内容充分性
      - 聚焦代码、宽范围完整整理和增量融合均有当前内容证据；证据仍限于固定真实材料和少量模型运行
      - 增量融合已经在认证父知识与后来材料上通过两个独立模型重放：父知识保留、原位融合、入口语义同步和候选差异均有内容证据
      - 人工批准、正式知识发布与干净消费已经完成；本 Release 不预装领域知识
      - 跨领域、OpenCode 实际宿主、部分批准、发布回滚和过程成本优化仍未验证
  knowledge_query_and_context:
    adoption: verified_at_quality_check_trusted_query_slices
    entrypoints:
      - .agents/skills/answer-from-knowledge/SKILL.md
      - .agents/skills/answer-from-knowledge/scripts/knowledge_route.py
      - knowledge/index.md
    limits:
      - 当前只使用入口链接路由、产品视图、规范页和必要的有界 rg，不包含 FTS、向量、图查询或 Web UI
      - 入口路由器只对受治理链接的标题与上下文做确定性排序，不读取原料、不回答问题、不持久化索引或状态
      - 普通问答不创建持久状态；答案状态、最低充分范围和任务上下文仍由 Agent 语义判断
      - 确定性路由在十个质检问法上主入口通过；固定较弱模型在新的人员权限与交付状态问题上实际调用路由、零宽泛搜索并取得完整内容结果
      - 证据限于当前中文 Markdown、单一宿主/模型、单一质检领域和最多三篇规范页；第二领域、OpenCode、大规模知识与精确源码联查仍未验证
  knowledge_guided_development:
    adoption: verified_at_three_manual_qc_development_and_one_trusted_context_composite_slice
    dependencies:
      - knowledge_query_and_context
    entrypoints:
      - .agents/skills/develop-with-knowledge/SKILL.md
      - .agents/skills/answer-from-knowledge/scripts/knowledge_route.py
    limits:
      - 已在验收配额页面、问题选项只读 SQL 性能和验收分配缺口跨层算法三类用例上完成成功重放；证据仍限于同一质检领域、宿主和模型
      - 分配缺口用例中盲测候选反证并纠正了首轮参考口径；这证明参考可被运行和领域语义推翻，不证明任意业务规则都能自动裁决
      - 本地 CSV 单事务写库取得正向证据，但仍存在不完整指标输入问题，不计入已验证切片
      - 真实页面出现与页面交互必须分别取证；最终知识变化交接仍有被弱模型跳过的记录
      - 不包含自动上下文组装、环境管理或正式知识自动发布
      - 确定性知识入口路由已经接入开发 Skill；“验收未完成量”复合 Trial 中较弱模型只读两篇正式知识后停止，并完成真实代码、最大组合与超限拒绝、API 与 Edge 用户旅程
      - 复合 Trial 的模型页面验证曾使用默认两日 Scope，四级固定值由独立评测补齐；当前规则已要求 API、SQL 与页面显式使用同一 Scope
      - 复合 Trial 的知识变化候选仍缺精确正式 owner；代码到规范知识发布仍属于 human-review-required
      - 低风险局部修改不应被机械升级为完整流程

promotion_policy:
  allowed:
    - 真实纵向能力已经产生用户可用结果
    - 下一实验已确认用户流程、边界、技术选项和验收
  forbidden:
    - 仅存在于设计仓库的方案
    - 手工答案、stub、合成测试或不存在工具的能力声明
    - 依赖当前聊天历史或构建者临场能力才能理解的状态
