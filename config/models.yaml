# config/models.yaml
# 模型端点与参数配置
# 不要在此文件存储 API Key，Key 走环境变量

# ── 主力模型（用于知识摄入、验证、问答）──
primary:
  provider: gemini                    # gemini | openai | anthropic
  model: gemini-2.5-flash
  api_key_env: GEMINI_API_KEY         # 从此环境变量读取 Key
  max_tokens: 8192
  temperature: 0.2                    # 摄入和验证用低温度，提高一致性

# ── 验证门禁专用模型（可与主力相同或更快的小模型）──
verification:
  provider: gemini
  model: gemini-2.5-flash
  api_key_env: GEMINI_API_KEY
  temperature: 0.1

