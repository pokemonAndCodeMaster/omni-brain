schema_version: '0.1'
claim_owner: agent
human_review_status: pending
target_reader: <谁要使用这批知识，已有多少背景>
intended_outcome: <读完后能够理解、判断或执行什么>

# 三层知识主线在阅读后、写正文前先填写 topic/source_files/primary_page；
# 正文形成并复核后再把 status 从 pending 改为 covered/partial/unknown/not_applicable。
# partial 必须在 rationale 同时说明“已覆盖什么”和“仍缺什么”。
# source_files 的每一项必须使用下面的 mapping，不要只写路径字符串：
#   - source_id: <source-id>
#     path: <来源根内的精确相对路径>
# primary_page 和 evidence_pages 都相对于 draft/knowledge/ 根填写，
# 例如 domains/quality/overview.md；不要加 draft/knowledge/ 前缀。
# 相邻层可以共用同一主落点，但必须在各自 rationale 说明为什么会一起维护，
# 并在正文中用清楚章节分别承载两层问题；不能用焦点局部代替上级全貌。
knowledge_path:
  - level: parent
    topic: <上级领域或根领域>
    status: pending
    source_files: []
    primary_page: ''
    relation_to_next: ''
    rationale: ''
  - level: subject
    topic: <本轮主题全貌>
    status: pending
    source_files: []
    primary_page: ''
    relation_to_next: ''
    rationale: ''
  - level: focus
    topic: <用户焦点>
    status: pending
    source_files: []
    primary_page: ''
    relation_to_next: ''
    rationale: ''

# dimension status: covered | partial | unknown | not_applicable
dimensions:
  - id: operating_model
    question: 从起点到真实完成的角色、流程、模块、上下游、并行、状态、异常与返工怎样运作？
    status: pending
    evidence_pages: []
    rationale: ''
  - id: information_model
    question: 核心数据、标识、口径、输入输出及其关系是什么？
    status: pending
    evidence_pages: []
    rationale: ''
  - id: system_and_software
    question: 若涉及软件，业务动作如何映射到真实入口、包/模块、类/函数、数据转换、运行调用和输出？
    status: pending
    evidence_pages: []
    rationale: ''
  - id: rules_and_mechanisms
    question: 若存在规则或算法，其输入、输出、不变量、步骤和边界是什么？
    status: pending
    evidence_pages: []
    rationale: ''
  - id: shared_dependencies
    question: 跨领域或公共能力哪些已覆盖、哪些相关但尚未抽取或缺证据、哪些确实不适用；其规范落点和本领域使用契约是什么？
    status: pending
    evidence_pages: []
    rationale: ''
  - id: history_conflicts_and_unknowns
    question: 当前事实、历史、目标、冲突和未知是否清楚分开？
    status: pending
    evidence_pages: []
    rationale: ''
visuals:
# visual status: provided | not_applicable
# provided 仅用于含有效图类型声明、语法可渲染并有相邻解释的图表
  status: pending
  rationale: ''
  evidence_pages: []
